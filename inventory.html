<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Assets/css/Style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  
<div class="flex flex-col md:flex-row">

  <!-- SIDEBAR -->
  <div class="w-full md:w-64 bg-green-600 text-white p-5 min-h-screen">
    <h1 class="text-3xl font-bold mb-10 text-center md:text-left">Grocery Shop</h1>

    <ul class="space-y-4">

      <a href="./index.html"> <li class="bg-green-700 p-4 rounded-xl hover:bg-green-800 text-center md:text-left">Dashboard</li></a>

      <a href="./inventory.html"> <li class="bg-green-800 p-4 rounded-xl hover:bg-green-900 text-center md:text-left mt-4">Inventory</li></a>

       <a href="./expiry.html"><li class="bg-green-700 p-4 rounded-xl hover:bg-green-800 cursor-pointer mt-5">Expiry Management</li></a>
      
    </ul>

  </div>

  <!-- MAIN CONTENT -->
  <div class="flex-1 p-6">

    <h1 class="text-2xl font-bold mb-4">Inventory Management</h1>

    <!-- FORM -->
    <div class="grid grid-cols-1 md:grid-cols-7 gap-3 mb-6">

      <input id="name" class="p-2 border rounded" placeholder="Product Name">

      <select id="category" class="p-2 border rounded">
        <option value="">Select Category</option>
        <option value="Fruits">Fruits</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Dairy">Dairy</option>
        <option value="Grains">Grains</option>
        <option value="Beverages">Beverages</option>
      </select>

      <input id="mfg" type="date" class="p-2 border rounded">
      <input id="expiry" type="date" class="p-2 border rounded">
      <input id="qty" type="number" class="p-2 border rounded" placeholder="Qty">

      <select id="unit" class="p-2 border rounded">
        <option value="">Unit</option>
        <option value="Liter">Litre</option>
        <option value="Kg">Kg</option>
        <option value="Pack">Pack</option>
      </select>

      <input id="price" type="number" class="p-2 border rounded" placeholder="Price">

    </div>

    <button onclick="addProduct()"class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Add Product</button>
 
    <!-- TABLE -->
    <div class="overflow-x-auto mt-5">

      <table class="w-full bg-white border mt-5">

        <thead class="bg-green-700 text-white">
          <tr>
            <th class="p-2">S.No</th>
            <th>Barcode</th>
            <th>Product</th>
            <th>Category</th>
            <th>MFG</th>
            <th>Expiry</th>
            <th>Qty</th>
            <th>Unit</th>
            <th>Price</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>
   <button onclick="generateBillPDF()"class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 mb-4 mt-10">Print Bill</button>
    </div>

  </div>

</div>


<!-- EDIT MODAL -->
 <div id="editModal" class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm flex justify-center items-center">


  <div class="bg-white p-6 rounded-lg w-full max-w-2xl">

    <div class="relative mb-4">

  <!-- CLOSE BUTTON -->
  <button onclick="closeEditModal()"
    class="absolute top-0 right-0 text-gray-600 hover:text-red-500 text-2xl font-bold"> ×</button>

  <h2 class="text-xl font-bold">Edit Product</h2>

</div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

      <input id="editName" class="p-2 border rounded" placeholder="Product Name">

      <select id="editCategory" class="p-2 border rounded">
        <option value="">Select Category</option>
        <option value="Fruits">Fruits</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Dairy">Dairy</option>
        <option value="Grains">Grains</option>
        <option value="Beverages">Beverages</option>
      </select>

      <input id="editMfg" type="date" class="p-2 border rounded">
      <input id="editExpiry" type="date" class="p-2 border rounded">
      <input id="editQty" type="number" class="p-2 border rounded" placeholder="Qty">

      <select id="editUnit" class="p-2 border rounded">
        <option value="">Unit</option>
        <option value="Liter">Liter</option>
        <option value="Kg">Kg</option>
        <option value="Pack">Pack</option>
      </select>

      <input id="editPrice" type="number" class="p-2 border rounded" placeholder="Price">

    </div>

    <div class="flex justify-end gap-3 mt-4">
      <button onclick="updateProduct()" class="bg-green-600 text-white px-4 py-2 rounded">Update</button>

    </div>

  </div>
</div>



<script src="./Assets/js/invent.js"></script>
</div>
</body>
</html>
